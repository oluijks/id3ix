name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang clang-format cppcheck

      - name: Build
        run: make

      - name: Format check
        run: make format-check

      - name: Lint
        run: make lint
